<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alinova — লগইন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}

.scene{position:fixed;inset:0;background:linear-gradient(180deg,#1a0a2e 0%,#16213e 30%,#0f3460 60%,#1a7a4a 100%);overflow:hidden;}

.stars{position:absolute;top:0;left:0;width:100%;height:40%;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate;}
@keyframes twinkle{from{opacity:0.3;}to{opacity:1;}}

.moon{position:absolute;top:30px;right:60px;width:50px;height:50px;background:radial-gradient(circle at 35% 35%,#fff8d6,#f0d060);border-radius:50%;box-shadow:0 0 18px rgba(240,208,96,0.5);animation:moonPulse 4s ease-in-out infinite;}
@keyframes moonPulse{0%,100%{box-shadow:0 0 18px rgba(240,208,96,0.5);}50%{box-shadow:0 0 32px rgba(240,208,96,0.8);}}

.bird{position:absolute;animation:flyBird linear infinite;}
@keyframes flyBird{from{transform:translateX(-60px);}to{transform:translateX(110vw);}}

.tree{position:absolute;bottom:0;}

.ground-glow{position:absolute;bottom:0;left:0;width:100%;height:80px;background:linear-gradient(to top,rgba(26,122,74,0.4),transparent);}
.path-glow{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:30px;height:30px;background:rgba(255,220,100,0.7);border-radius:50%;box-shadow:0 0 20px 8px rgba(255,200,50,0.5);animation:walkerPulse 1.5s ease-in-out infinite;}
@keyframes walkerPulse{0%,100%{opacity:0.7;}50%{opacity:1;}}

.leaves-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.leaf{position:absolute;top:-40px;animation:fall linear infinite;}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:0.9;}
  50%{transform:translateY(50vh) rotate(180deg) translateX(40px);opacity:0.7;}
  100%{transform:translateY(105vh) rotate(360deg) translateX(-20px);opacity:0;}
}

.card-wrap{position:relative;z-index:10;width:100%;max-width:360px;padding:16px;}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:40px 32px 36px;box-shadow:0 8px 40px rgba(0,0,0,0.4);}

.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.logo-icon{width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:26px;height:26px;fill:#fff;}
.logo-text{font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.logo-text span{color:#4ade80;}
.subtitle{text-align:center;color:rgba(255,255,255,0.55);font-size:13px;margin-bottom:26px;}

.field{margin-bottom:16px;}
.field-label{display:block;font-size:13px;font-weight:600;color:#ffffff;margin-bottom:6px;}
.field-input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);border-radius:10px;color:#ffffff;font-size:15px;font-family:'Hind Siliguri',sans-serif;outline:none;transition:all 0.2s;}
.field-input::placeholder{color:rgba(255,255,255,0.75);}
.field-input:focus{border-color:#4ade80;background:rgba(255,255,255,0.2);box-shadow:0 0 0 3px rgba(74,222,128,0.15);}

.login-btn{width:100%;margin-top:10px;padding:13px;background:linear-gradient(90deg,#1a7a4a,#22c55e);color:#fff;border:none;border-radius:10px;font-size:16px;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,0.4);}
.login-btn:active{transform:translateY(0);}

.bottom-link{text-align:center;margin-top:18px;font-size:13px;color:rgba(255,255,255,0.6);}
.bottom-link a{color:#4ade80;text-decoration:none;font-weight:600;}

.error{background:rgba(192,57,43,0.25);border:1px solid rgba(192,57,43,0.4);color:#fca5a5;padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>

<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <svg class="bird" style="top:55px;animation-duration:9s;animation-delay:0s" width="24" height="10" viewBox="0 0 24 10">
    <path d="M0 5 Q6 0 12 5 Q18 0 24 5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  </svg>
  <svg class="bird" style="top:85px;animation-duration:13s;animation-delay:5s" width="18" height="8" viewBox="0 0 18 8">
    <path d="M0 4 Q4.5 0 9 4 Q13.5 0 18 4" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  </svg>

  <svg class="tree" style="left:-10px" width="90" height="200" viewBox="0 0 90 200">
    <polygon points="45,10 5,120 85,120" fill="#0a3020"/>
    <polygon points="45,50 10,150 80,150" fill="#0d3d27"/>
    <polygon points="45,90 15,200 75,200" fill="#0f4a2e"/>
  </svg>
  <svg class="tree" style="left:65px" width="60" height="140" viewBox="0 0 60 140">
    <polygon points="30,5 3,90 57,90" fill="#0c3a22"/>
    <polygon points="30,40 5,120 55,120" fill="#0f4a2e"/>
    <polygon points="30,70 8,140 52,140" fill="#1a5c38"/>
  </svg>
  <svg class="tree" style="right:-10px" width="80" height="180" viewBox="0 0 80 180">
    <polygon points="40,5 5,110 75,110" fill="#0a3020"/>
    <polygon points="40,45 8,135 72,135" fill="#0d3d27"/>
    <polygon points="40,85 12,180 68,180" fill="#0f4a2e"/>
  </svg>
  <svg class="tree" style="right:65px" width="55" height="130" viewBox="0 0 55 130">
    <polygon points="27,5 2,85 53,85" fill="#0a3020"/>
    <polygon points="27,38 5,110 50,110" fill="#0d3d27"/>
    <polygon points="27,65 8,130 47,130" fill="#0f4a2e"/>
  </svg>

  <div class="ground-glow"></div>
  <div class="path-glow"></div>
</div>

<div class="leaves-container" id="leavesContainer"></div>

<div class="card-wrap">
  <div class="card">

    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm0-3H7V6h10v2z"/></svg>
      </div>
      <div class="logo-text">Ali<span>nova</span></div>
    </div>
    <p class="subtitle">আপনার অ্যাকাউন্টে লগইন করুন</p>

    <form method="POST">
      {% if error %}
      <div class="error">⚠️ {{ error }}</div>
      {% endif %}

      <div class="field">
        <label class="field-label">ইউজারনেম</label>
        <input class="field-input" name="username" type="text" placeholder="আপনার নাম লিখুন" required />
      </div>

      <div class="field">
        <label class="field-label">পাসওয়ার্ড</label>
        <input class="field-input" name="password" type="password" placeholder="পাসওয়ার্ড লিখুন" required />
      </div>

      <button class="login-btn" type="submit">লগইন করুন</button>
    </form>

    <div class="bottom-link">নতুন ইউজার? <a href="/register">রেজিস্টার করুন</a></div>
  </div>
</div>

<script>
const starsEl = document.getElementById('stars');
for(let i = 0; i < 50; i++){
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2 + 1;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${1+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
  starsEl.appendChild(s);
}

const leafColors = ['#c0392b','#e67e22','#f39c12','#d35400','#27ae60','#8e44ad'];
const leafShapes = [
  'M10,0 Q20,5 10,20 Q0,5 10,0',
  'M8,0 C16,4 16,12 8,18 C0,12 0,4 8,0',
  'M0,8 Q8,0 16,8 Q8,20 0,8',
  'M12,0 Q22,6 12,22 Q2,6 12,0'
];
const lc = document.getElementById('leavesContainer');

function spawnLeaf(){
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  const color = leafColors[Math.floor(Math.random() * leafColors.length)];
  const shape = leafShapes[Math.floor(Math.random() * leafShapes.length)];
  const size = 10 + Math.random() * 14;
  const dur = 3 + Math.random() * 4;
  const delay = Math.random() * 2;
  leaf.style.cssText = `left:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${delay}s;`;
  leaf.innerHTML = `<svg width="${size}" height="${size*1.2}" viewBox="0 0 20 22"><path d="${shape}" fill="${color}" opacity="0.9"/></svg>`;
  lc.appendChild(leaf);
  setTimeout(() => leaf.remove(), (dur + delay) * 1000 + 300);
}

for(let i = 0; i < 15; i++) setTimeout(spawnLeaf, i * 280);
setInterval(spawnLeaf, 400);
</script>
</body>
</html>
